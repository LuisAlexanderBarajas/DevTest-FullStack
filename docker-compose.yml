services:
  # Base de Datos MySQL
  mysqldb:
    image: mysql:8.0
    container_name: devtest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mid_challenge_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build: ./backend
    container_name: devtest-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysqldb:3306/mid_challenge_db?serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=admin
      - DOCKER_MODE=true 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - code_executions:/app/temp_executions
    depends_on:
      mysqldb:
        condition: service_healthy

  # Frontend Angular
  frontend:
    build: ./front
    container_name: devtest-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # entornos (Sandbox)
  java-warmer:
    image: eclipse-temurin:17-jdk-alpine
    container_name: devtest-java-warmer
    command: ["echo", "Imagen de Java lista"]

  python-warmer:
    image: python:3.9-slim
    container_name: devtest-python-warmer
    command: ["echo", "Imagen de Python lista"]

  js-warmer:
    image: node:18-alpine
    container_name: devtest-js-warmer
    command: ["echo", "Imagen de JavaScript lista"]

  ts-warmer:
    image: denoland/deno:alpine
    container_name: devtest-ts-warmer
    command: ["echo", "Imagen de TypeScript lista"]
  
  # cobol
  cobol-builder:
    build:
      context: ./backend
      dockerfile: Dockerfile.cobol
    image: devtest-cobol
    container_name: devtest-cobol-builder
    command: ["echo", "Imagen COBOL lista para usarse"]

volumes:
  db_data:
  code_executions:
    name: code_executions