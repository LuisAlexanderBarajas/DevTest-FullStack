services:
  # Base de Datos MySQL
  mysqldb:
    image: mysql:8.0
    container_name: devtest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mid_challenge_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build: ./backend
    container_name: devtest-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysqldb:3306/mid_challenge_db?serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=admin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/temp_executions:/app/temp_executions
    depends_on:
      mysqldb:
        condition: service_healthy

  # Frontend Angular
  frontend:
    build: ./front
    container_name: devtest-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: