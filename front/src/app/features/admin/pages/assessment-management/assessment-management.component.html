<div class="admin-container">
    <section class="admin-section">
      <div class="section-header">
        <h3><i class='bx bxs-folder-open'></i> Gestión de Evaluaciones</h3>
        <button class="btn-primary" routerLink="/assessment/create">
          <i class='bx bx-plus'></i> Nueva Evaluación
        </button>
      </div>
  
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Tiempo Límite</th>
              <th>Preguntas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (item of assessments(); track item.id) {
              <tr>
                <td>#{{ item.id }}</td>
                <td><strong>{{ item.name }}</strong></td>
                <td>{{ item.timeLimitMinutes }} min</td>
                <td>{{ item.questionCount }}</td>
                <td class="actions-cell">
                    <button class="btn-icon edit" title="Editar" [routerLink]="['/assessment/edit', item.id]">
                        <i class='bx bx-pencil'></i>
                    </button>
                  <button class="btn-icon delete" title="Eliminar" (click)="deleteAssessment(item.id, item.name)">
                    <i class='bx bx-trash'></i>
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5" class="empty-row">No hay evaluaciones registradas.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </section>
  </div>
