spring.application.name=backend

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://mysqldb:3306/mid_challenge_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Clave secreta para JWT
jwt.secret=${JWT_SECRET:clave_secreta_para_jwt_reto_tecnico_fullstack_mid}
jwt.expiration=60000000

# Ruta para ver el contrato Swagger
springdoc.swagger-ui.path=/swagger-ui.html